name: Build APK

# Roda quando você faz push na branch main, ou manualmente pelo botão "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Build do app web (Vite)
        run: npm run build

      - name: Adicionar plataforma Android (Capacitor)
        run: npx cap add android

      - name: Copiar google-services.json (Firebase)
        run: cp google-services.json android/app/google-services.json

      - name: Adicionar permissão de notificação (Android 13+)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar build com o Android
        run: npx cap sync android

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gerar APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: oryx-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
